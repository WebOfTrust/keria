name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag matching the package version (e.g. 0.4.1)
        type: string
        required: true
jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.version }}

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          if version != os.environ["RELEASE_VERSION"]:
              raise SystemExit("Release tag must match the pyproject.toml version")
          PY

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: weboftrust/keria
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest

      # For multi-arch
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker Layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: keri-${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            keri-${{ runner.os }}-buildx-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/keria.dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
